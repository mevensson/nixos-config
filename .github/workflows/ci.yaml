name: ci

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix caches
        uses: cachix/cachix-action@v16
        with:
          name: mevensson-nixos-config
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: nix-community

      - name: Check Flake
        run: nix flake check --show-trace

  build-live-installer:
    runs-on: ubuntu-latest
    needs: [ check ]

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix caches
        uses: cachix/cachix-action@v16
        with:
          name: mevensson-nixos-config
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: nix-community

      - name: Check Free Disk
        run: df -H

      - name: Build
        run: |
          nix build .#nixosConfigurations.live-installer.config.system.build.toplevel

      - name: Check Free Disk
        run: df -H

  success:
    runs-on: ubuntu-latest
    needs:
    - build-live-installer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix caches
        uses: cachix/cachix-action@v16
        with:
          name: mevensson-nixos-config
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: nix-community

      - name: Show Flake
        run: nix flake show --allow-import-from-derivation

  failure:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    needs:
    - build-live-installer

    steps:
      - run: |
          echo "Some workflows have failed!"
          exit 1
